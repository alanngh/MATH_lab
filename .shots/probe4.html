<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<pre id="out" style="font:12px monospace;white-space:pre-wrap"></pre>
<script>
var lines = [];
window.addEventListener("message", function (e) { lines.push("msg: " + e.data); });
var f = document.createElement("iframe");
f.style.cssText = "width:1440px;height:1000px;border:0";
f.src = "../index.html#classes/1226";
document.body.appendChild(f);
setTimeout(function () {
  var d = f.contentDocument, w = f.contentWindow;
  var fp = d.getElementById("fpanel");
  lines.push("portal=" + d.getElementById("classes").className);
  lines.push("fpanelLen=" + fp.innerHTML.length);
  lines.push("slots=" + d.querySelectorAll(".slot").length);
  lines.push("orbs=" + d.querySelectorAll(".orb").length);
  // try clicking the first orb to see whether the click path works
  var orb = d.querySelector(".orb");
  if (orb) orb.click();
  setTimeout(function () {
    lines.push("after click portal=" + d.getElementById("classes").className);
    lines.push("after click fpanelLen=" + d.getElementById("fpanel").innerHTML.length);
    lines.push("after click heroStage=" + d.getElementById("heroStage").className);
    document.getElementById("out").textContent = lines.join("\n");
  }, 2200);
}, 2500);
</script>
</body></html>
