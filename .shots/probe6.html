<!doctype html><html><head><meta charset="utf-8"></head><body>
<pre id="out" style="font:12px monospace;white-space:pre-wrap"></pre>
<script>
var f=document.createElement("iframe"); f.style.cssText="width:1440px;height:1000px;border:0"; f.src="../index.html#classes/1226";
f.onload=function(){ setTimeout(function(){
 var d=f.contentDocument,w=f.contentWindow;
 function cs(s,props){var e=d.querySelector(s); if(!e)return s+": MISSING"; var c=w.getComputedStyle(e); return s+" "+props.map(function(p){return p+"="+c.getPropertyValue(p);}).join(" ");}
 document.getElementById("out").textContent=[
  "inner="+w.innerWidth+"x"+w.innerHeight,
  "heroStage=["+d.getElementById("heroStage").className+"]",
  cs("#heroStage","grid-template-columns"),
  cs(".hero-copy","width"),
  cs(".wordmark","font-size"),
  "portal=["+d.getElementById("classes").className+"]",
  cs(".portal-stage","flex-direction min-height"),
  cs(".wheel","width transform"),
  cs(".fpanel","display position width margin-left"),
  cs(".frow","width")
 ].join("\n");
},2000);};
document.body.appendChild(f);
</script></body></html>
